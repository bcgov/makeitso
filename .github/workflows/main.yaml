# Main workflow to orchestrate all other workflows
name: main workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build passed"
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      # Fails about half the time, so some commits are blocked and need emergency mode to deploy
      - run: |
          if [ $((RANDOM % 2)) -eq 0 ]; then
            echo "Tests failed (on purpose, at random)"
            exit 1
          fi
          echo "Tests passed"
