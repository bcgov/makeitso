name: Run tests

on:
  workflow_call:

# Check out the code, and post the coverage comment on PRs
permissions:
  contents: read
  pull-requests: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov
      - name: Coverage report
        run: |
          { echo "### Coverage"; echo; uv run coverage report --format=markdown; } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      # Updates the bot's last comment, so each push doesn't add a new one.
      # Skipped for PRs from forks, whose token can't comment
      - name: Comment coverage on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file coverage.md
