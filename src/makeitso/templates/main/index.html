{% extends "base.html" %}

{% block content %}
<h1>makeitso</h1>
<p class="lead">Deployment orchestrator. The skeleton is up and running.</p>

<div class="card">
  <div class="card-body">
    <h2 class="h5 card-title">Bootstrap</h2>
    <button type="button" class="btn btn-primary">Primary button</button>
  </div>
</div>

<div class="card mt-4">
  <div class="card-body">
    <h2 class="h5 card-title">HTMX</h2>
    <button type="button" class="btn btn-primary"
            hx-get="{{ url_for('main.server_time') }}" hx-target="#server-time">
      Get server time
    </button>
    <div id="server-time" class="mt-3"></div>
  </div>
</div>
{% endblock %}
