{% extends "base.html" %}


{% block content %}
<h1>makeitso</h1>
<p class="lead">Deployment orchestrator. The skeleton is up and running.</p>

{% if session.user %}

<div class="card mt-4">
  <div class="card-body">
    <h2 class="h5 card-title">Background job (RQ)</h2>
    <button type="button" class="btn btn-primary"
            hx-post="{{ url_for('main.enqueue_example_job') }}" hx-target="#job-status">
      Run example job
    </button>
    <div id="job-status" class="mt-3"></div>
  </div>
</div>
{% else %}
<p>Please <a href="{{ url_for('auth.login') }}">log in with GitHub</a> to continue.</p>
{% endif %}
{% endblock %}
