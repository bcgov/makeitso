

 <section class="pt-3">
    <div class="d-flex justify-content-between align-items-baseline border-bottom">
        <h2 class="h5">Queue: {{ queue.name }}</h2>
    </div>
    <ul class="list-unstyled">
        {% for job in queue.jobs %}
            {% include "monitor/_job.html" with context %}
        {% else %}
            <li class="text-muted py-3">No {{ queue.name }} yet.</li>
        {% endfor %}
    </ul>
</section>
