apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "makeitso.fullname" . }}-stack-sync
  labels:
    component: stack-sync
{{- include "makeitso.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.stackSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
{{- include "makeitso.selectorLabels" . | nindent 12 }}
            component: stack-sync
        spec:
          restartPolicy: Never
          containers:
            - name: {{ template "makeitso.fullname" . }}-stack-sync
              image: {{ .Values.app.image }}:{{ .Values.app.imageTag }}
              imagePullPolicy: {{ .Values.app.imagePullPolicy }}
              # Only queues the syncs; the worker runs them
              command: ["flask", "--app", "makeitso", "stacks", "sync"]
              env:
                {{- include "makeitso.commonEnv" . | nindent 16 }}
                {{- include "makeitso.superuserDbEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 200Mi
