apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "makeitso.fullname" . }}
  labels:
{{ include "makeitso.labels" . | indent 4 }}
  annotations:
    haproxy.router.openshift.io/balance: roundrobin
spec:
  host: {{ .Values.route.host }}
  port:
    targetPort: {{ include "makeitso.fullname" . }}-port
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name:  {{ include "makeitso.fullname" . }}
    weight: 100
    