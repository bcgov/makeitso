[project]
name = "makeitso"
version = "0.1.0"
description = "A deployment orchestrator for GitHub-hosted projects."
readme = "README.md"
authors = [
    { name = "Dylan", email = "dylan.1.leard@gov.bc.ca" },
    { name = "Sepehr", email = "sepehr.sobhani@gov.bc.ca" },
    { name = "Pierre", email = "pierre.bastianelli@gov.bc.ca" },
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.8.0",
    "bootstrap-flask>=2.6.0",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "pygithub>=2.10.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "rq>=2.12.0",
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets test files share a name across folders (tests/main/test_routes.py, tests/stacks/test_routes.py)
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["src/makeitso"]
# Also checks that each `if` went both ways, not just that its lines ran
branch = true

[tool.coverage.report]
# List the lines no test ran, and hide files that are fully covered
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
# Autogenerated by Alembic
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.rules]
# Flask-SQLAlchemy builds db.Model at runtime, so ty can't verify it as a base class
unsupported-base = "ignore"
