[project]
name = "makeitso"
version = "0.1.0"
description = "A deployment orchestrator for GitHub-hosted projects."
readme = "README.md"
authors = [
    { name = "Dylan", email = "dylan.1.leard@gov.bc.ca" },
    { name = "Sepehr", email = "sepehr.sobhani@gov.bc.ca" },
    { name = "Pierre", email = "pierre.bastianelli@gov.bc.ca" },
]
requires-python = ">=3.14"
dependencies = [
    "bootstrap-flask>=2.6.0",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "rq>=2.12.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.8", "ty>=0.0.83"]

[tool.ruff]
line-length = 100
# Autogenerated by Alembic
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.rules]
# Flask-SQLAlchemy builds db.Model at runtime, so ty can't verify it as a base class
unsupported-base = "ignore"
